<script>const tasks = [
  {id:0, title:'Put the alphabet soup and tomato sauce in the basket', scene:'LIVING_ROOM_SCENE2'},
  {id:6, title:'Place the white mug on the plate and the pudding to its right', scene:'LIVING_ROOM_SCENE6'},
  {id:2, title:'Turn on the stove and place the moka pot on it', scene:'KITCHEN_SCENE3'},
  {id:3, title:'Put the black bowl in the bottom drawer and close it', scene:'KITCHEN_SCENE4'},
  {id:9, title:'Put the yellow-and-white mug in the microwave and close the door', scene:'KITCHEN_SCENE6'},
  {id:1, title:'Put the cream cheese box and butter in the basket', scene:'LIVING_ROOM_SCENE2'},
  {id:4, title:'Place the white mug on the left plate and the yellow-and-white mug on the right plate', scene:'LIVING_ROOM_SCENE5'},
  {id:5, title:'Place the book in the back compartment of the caddy', scene:'STUDY_SCENE1'},
  {id:7, title:'Put the alphabet soup and cream cheese box in the basket', scene:'LIVING_ROOM_SCENE1'},
  {id:8, title:'Put both moka pots on the stove', scene:'KITCHEN_SCENE8'},
];
const candidateDescriptions = {
  nominal: 'Replays the original demonstration actions.',
  xyz_noise_008: 'Adds Gaussian noise (standard deviation 0.08 command units) to XYZ translation at each step.',
  xyz_noise_016: 'Adds Gaussian noise (standard deviation 0.16 command units) to XYZ translation at each step.',
  translation_half: 'Scales each XYZ translation command by 0.5.',
  gripper_delay_6: 'Delays the gripper command sequence by 6 steps (0.3 s at 20 Hz).',
  premature_release: 'Advances the first eligible gripper release by up to 10 steps (0.5 s at 20 Hz).',
  translation_overshoot: 'Scales each XYZ translation command by 1.5.',
};
const main = document.querySelector('#main');
const modal = document.querySelector('#modal');
const details = document.querySelector('#details');
const escape = value => String(value ?? '').replace(/[&<>"']/g, char =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[char]);
const options = (values, all) => (all ? '<option value="">' + all + '</option>' : '') +
  values.map(value => '<option>' + escape(value) + '</option>').join('');
let datasets = {};
let page = location.hash === '#datasets' ? 'datasets' : 'composite';
let version = '';
let loadError = '';
const rows = () => datasets[version] || [];
const videoUrl = path => new URL(path, document.querySelector('#catalog-data') ?
  location.href : new URL('../', location.href)).href;
const demoDownload = (row, number) => row?.download_path ?
  '<a class="demo-download" href="' + escape(videoUrl(row.download_path)) +
  '" download aria-label="Download Demo ' + escape(number) + ' as ZIP">Download Demo</a>' : '';

async function refresh() {
  try {
    const snapshot = document.querySelector('#catalog-data');
    if (snapshot) {
      datasets = JSON.parse(snapshot.textContent);
    } else {
      const result = await fetch('data.json', {cache:'no-store'});
      if (!result.ok) throw new Error(result.status);
      datasets = await result.json();
    }
    if (!(version in datasets)) version = Object.hasOwn(datasets, 'catalog_v1') ?
      'catalog_v1' : Object.keys(datasets).at(-1) || '';
    loadError = '';
  } catch {
    loadError = 'Could not load records. Open the catalog through catalog/serve.py.';
  }
  render();
}

function render() {
  document.querySelectorAll('[data-page]').forEach(button => {
    button.classList.toggle('active', button.dataset.page === page);
    button.setAttribute('aria-current', button.dataset.page === page ? 'page' : 'false');
  });
  if (page === 'datasets') {
    const summary = Object.entries(datasets).map(([name, records]) =>
      '<tr><td>' + escape(name) + '</td><td>' + new Set(records.map(r => r.task_id)).size +
      '</td><td>' + new Set(records.map(r => r.group_id)).size + '</td><td>' + records.length +
      '</td><td>' + records.filter(r => r.playable).length + '</td></tr>').join('');
    main.innerHTML = '<h1>Datasets</h1><p>Each pair contains a WAP prediction and a LIBERO execution with a shared starting state and action sequence.</p>' +
      '<h2>Dataset Scale</h2><div class="table"><table><thead><tr><th>Version</th><th>Task</th><th>Start Groups</th><th>Valid Records</th><th>Playable</th></tr></thead><tbody>' +
      (summary || '<tr><td colspan="5">No generated records available</td></tr>') + '</tbody></table></div>' +
      '<h2>100-Pair Collection Configuration</h2><p>Use all 10 LIBERO-10 tasks, with five windows from distinct demonstrations per task and two candidates per window. Pair the original actions with one stage-appropriate perturbation. Each pair uses 40 actions (2 seconds at 20 Hz). The generator checks frame counts, reset state, and duration before accepting a pair. The original MVP keeps its six candidates per demo.</p>' +
      '<h2>Starting Windows and Action Candidates</h2><p>Each task uses five distinct source demonstrations. A fixed random seed selects one eligible 40-action window from each. Every window pairs the original actions (<code>nominal</code>) with one perturbation:</p>' +
      '<div class="table"><table><thead><tr><th>Window Slot</th><th>Eligibility</th><th>Second Candidate</th></tr></thead><tbody>' +
      '<tr><td>1</td><td>Contains a release that can be advanced</td><td><code>premature_release</code> · advance release by up to 10 steps</td></tr>' +
      '<tr><td>2</td><td>Contains a gripper transition that can be delayed within the window</td><td><code>gripper_delay_6</code> · delay gripper commands by 6 steps</td></tr>' +
      '<tr><td>3</td><td>Contains arm motion</td><td><code>translation_half</code> · scale XYZ translation by 0.5</td></tr>' +
      '<tr><td>4</td><td>Contains arm motion</td><td><code>xyz_noise_008</code> · add XYZ Gaussian noise with standard deviation 0.08</td></tr>' +
      '<tr><td>5</td><td>Contains arm motion</td><td><code>xyz_noise_016</code> · add XYZ Gaussian noise with standard deviation 0.16</td></tr>' +
      '</tbody></table></div><p>If the remaining demonstrations lack an eligible gripper event, the collection uses <code>xyz_noise_008</code> for that slot. The three arm-motion slots may cover similar stages. The original MVP also contains <code>translation_overshoot</code> (1.5× XYZ); the new collection has no dedicated slot for it. See Tasks for the candidates actually generated for each demo.</p>' +
      '<h2>Loading Generated Data</h2><p>Refresh after the generation script updates data/manifests/&lt;version&gt;/rollouts.jsonl. Playback is available when both videos are present.</p>' +
      '<button id="refresh">Refresh Records</button><p role="status">' + escape(loadError) + '</p>';
    const refreshButton = document.querySelector('#refresh');
    if (document.querySelector('#catalog-data')) {
      refreshButton.replaceWith(Object.assign(document.createElement('p'), {
        textContent: 'Offline snapshot. Run python catalog/export.py after generation to update this file.',
      }));
    } else {
      refreshButton.onclick = refresh;
    }
    return;
  }
  renderTasks();
}

function renderTasks() {
  main.innerHTML = '<h1>Tasks</h1><p>Each demo groups the action candidates tested from the same starting state. Each candidate has its own WAP and LIBERO video pair.</p>' +
    '<form class="filters"><label>Dataset Version<select name="version">' + options(Object.keys(datasets)) +
    '</select></label><label>Task ID<select name="task">' +
    options(tasks.map(task => task.id).sort((a,b) => a-b), 'All') +
    '</select></label><label>Scene<select name="scene">' +
    options([...new Set(tasks.map(task => task.scene))].sort(), 'All') +
    '</select></label><label>Rollout Window<select name="window"></select></label></form>' +
    '<p id="count" role="status"></p><div class="table"><table><thead><tr><th>Demo</th><th>Task</th>' +
    '<th>Action Candidates</th><th>Rollout Window</th><th>Video</th>' +
    '</tr></thead><tbody></tbody></table></div><p>' + escape(loadError) + '</p>';
  const form = main.querySelector('form');
  const body = main.querySelector('tbody');
  form.elements.version.value = version;
  let displayed = [];
  function update() {
    version = form.elements.version.value;
    const taskId = form.elements.task.value;
    const scene = form.elements.scene.value;
    const window = form.elements.window;
    const previousWindow = window.value;
    const selectedTasks = tasks.filter(task => (!taskId || String(task.id) === taskId) &&
      (!scene || task.scene === scene));
    const scoped = rows().filter(row => selectedTasks.some(task => task.id === row.task_id));
    const durations = [...new Set(scoped.map(row => row.sim_horizon_s).filter(value => value != null))].sort((a,b) => a-b);
    window.innerHTML = options(durations, 'All');
    window.value = durations.map(String).includes(previousWindow) ? previousWindow : '';
    const visibleRows = scoped.filter(row => !window.value || String(row.sim_horizon_s) === window.value);
    const groupRows = records => {
      const result = new Map();
      for (const row of records) {
        if (!result.has(row.group_id)) result.set(row.group_id, []);
        result.get(row.group_id).push(row);
      }
      return result;
    };
    const demoNumbers = new Map([...groupRows(rows()).keys()].map((key,index) => [key,index+1]));
    displayed = [...groupRows(visibleRows).values()];
    const pending = window.value ? [] : selectedTasks.filter(task => !scoped.some(row => row.task_id === task.id));
    main.querySelector('#count').textContent = displayed.length + ' demos / ' + visibleRows.length + ' generated pairs';
    const taskCell = task => '<td><strong>Task ' + task.id + '</strong><br><small>' + escape(task.scene) + '</small></td>';
    const rendered = displayed.map((records,index) => {
      const row = records[0];
      const task = tasks.find(task => task.id === row.task_id);
      const candidates = '<details class="candidate-summary"><summary>' + records.length +
        ' candidates</summary><ul>' + records.map(candidate => {
          const applied = candidate.candidate_type || 'Not recorded';
          const requested = candidate.requested_type || applied;
          return '<li><code>' + escape(requested) + '</code><br>' +
            (requested === applied ? '' : '<small>Applied <code>' + escape(applied) + '</code></small><br>') +
            escape(candidateDescriptions[applied] || 'No candidate description available.') +
            (candidate.notes?.length ? '<br><small>' + escape(candidate.notes.join(' ')) + '</small>' : '') + '</li>';
        }).join('') + '</ul></details>';
      const horizons = [...new Set(records.map(r => r.sim_horizon_s).filter(value => value != null))];
      const applied = [...new Set(records.map(candidate => candidate.candidate_type).filter(Boolean))];
      const baseline = applied.includes('nominal');
      const perturbations = applied.filter(kind => kind !== 'nominal');
      const comparison = baseline && perturbations.length ? 'Original actions compared with ' + perturbations.join(', ') :
        baseline ? 'Original demonstration actions.' :
        perturbations.length ? 'Recorded action settings: ' + perturbations.join(', ') + '.' : 'Candidate settings were not recorded.';
      const stage = [...new Set(records.map(candidate => candidate.stage).filter(Boolean))];
      const description = (stage.length ? stage.join(', ') + '. ' : '') + comparison;
      const demoNumber = demoNumbers.get(row.group_id);
      return '<tr><td><strong>Demo ' + demoNumber + '</strong><br><small>' +
        escape(description) + '</small></td>' + taskCell(task) +
        '<td>' + candidates + '</td><td>' + (horizons.length ? escape(horizons.join(', ')) + ' s' : 'Not recorded') +
        '</td><td><div class="demo-actions"><button class="demo" data-pair="' + index +
        '">View Candidates</button>' + demoDownload(row, demoNumber) + '</div></td></tr>';
    });
    rendered.push(...pending.map(task => '<tr><td>No rollout yet</td>' + taskCell(task) +
      '<td colspan="3">No generated records in this dataset version.</td></tr>'));
    body.innerHTML = rendered.join('') || '<tr><td colspan="5">No matching records.</td></tr>';

  }
  form.addEventListener('input', update);
  body.onclick = event => {
    const button = event.target.closest('[data-pair]');
    if (!button) return;
    const records = displayed[Number(button.dataset.pair)];
    const row = records[0];
    const number = [...new Set(rows().map(item => item.group_id))].indexOf(row.group_id) + 1;
    showDemo(row.task_id, records, number);
  };
  update();
}

function showDemo(id, filteredRecords, demoNumber) {
  const task = tasks.find(t => t.id === id);
  const records = filteredRecords.filter(r => r.task_id === id);
  const groups = [...new Set(records.map(r => r.group_id))];
  details.innerHTML = '<h2>Demo ' + demoNumber + '</h2><p>Task ' + id + ' · ' + escape(task.scene) + '</p>' +
    '<div class="demo-controls"><label>Candidate Video<select id="candidate">' +
    records.map((row,index) => '<option value="' + index + '">' + escape(row.requested_type || row.candidate_type) +
      (row.requested_type && row.requested_type !== row.candidate_type ? ' (applied: ' + escape(row.candidate_type) + ')' : '') +
      '</option>').join('') + '</select></label>' + demoDownload(records[0], demoNumber) +
    '</div><div id="pair"></div>';
  if (groups.length) {
    const pair = details.querySelector('#pair');
    const candidate = details.querySelector('#candidate');
    function showPair() {
      const row = records[Number(candidate.value)];
      const metadata = [
        ['Task ID', row.task_id],
        ['Action Candidate', row.candidate_type],
        ['Rollout Window', row.sim_horizon_s == null ? null : row.sim_horizon_s + ' s' +
          (row.horizon_actions == null ? '' : ' / ' + row.horizon_actions + ' actions') +
          (row.action_rate_hz == null ? '' : ' at ' + row.action_rate_hz + ' Hz')],
        ['Perturbation Seed', row.perturb_seed],
        ['Clipped Commands', row.clip_fraction == null ? null : (100 * row.clip_fraction).toFixed(1) + '%'],
      ];
      const fallback = row.requested_type && row.requested_type !== row.candidate_type;
      pair.innerHTML = '<dl class="pair-settings">' + metadata.map(([label,value]) =>
        '<div><dt>' + label + '</dt><dd>' + escape(value ?? 'Not recorded') + '</dd></div>').join('') + '</dl>' +
        '<p>' + escape(candidateDescriptions[row.candidate_type] || 'No candidate description available.') + '</p>' +
        (fallback ? '<p>Requested <code>' + escape(row.requested_type) + '</code>. Applied <code>' +
          escape(row.candidate_type) + '</code>.' + (row.notes?.length ? ' ' + escape(row.notes.join(' ')) : '') + '</p>' : '') +
        (row.stage ? '<p>Stage: ' + escape(row.stage) + '</p>' : '') +
        (row.playable ? '<p><button id="play">Play Both</button> <button id="pause">Pause Both</button></p>' +
        '<div class="videos"><label>WAP Prediction<video controls muted playsinline src="' +
        escape(videoUrl(row.wm_video_path)) + '"></video></label><label>LIBERO Execution<video controls muted playsinline src="' +
        escape(videoUrl(row.sim_video_path)) + '"></video></label></div>' :
        '<p>The paired videos are missing from the local data/rollouts directory.</p>');
      if (!row.playable) return;
      const [wap, sim] = pair.querySelectorAll('video');
      pair.querySelector('#play').onclick = () => {
        sim.currentTime = wap.currentTime;
        Promise.all([wap.play(), sim.play()]).catch(() => { wap.pause(); sim.pause(); });
      };
      pair.querySelector('#pause').onclick = () => { wap.pause(); sim.pause(); };
    }
    candidate.onchange = showPair;
    showPair();
  }
  modal.showModal();
}

modal.addEventListener('close', () => details.replaceChildren());
function navigate() {
  page = location.hash === '#datasets' ? 'datasets' : 'composite';
  render();
}
document.querySelectorAll('[data-page]').forEach(button => button.onclick = () => { location.hash = button.dataset.page; });
window.addEventListener('hashchange', navigate);
refresh();
</script>
</html>
